services:
  app:
    build: .
    command: ["python", "-m", "app.run"]
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      WEB_WORKERS: "2"
      CORPUS_DB: /data/corpus.db
      ENABLE_COLLECTOR: "true"
      MIN_REQUEST_INTERVAL: "1.05"
      RETRY_AFTER_FALLBACK: "2"
      DEMO_A_URL: http://demo-a:8001
      DEMO_B_URL: http://demo-b:8001
      LOG_LEVEL: info
    volumes:
      - corpus-data:/data
    depends_on:
      demo-a:
        condition: service_healthy
      demo-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  demo-a:
    build: .
    command: ["python", "-m", "uvicorn", "demo.source:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      DEMO_NAME: demo-a
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/healthz').read()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  demo-b:
    build: .
    command: ["python", "-m", "uvicorn", "demo.source:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8002:8001"
    environment:
      DEMO_NAME: demo-b
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/healthz').read()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

volumes:
  corpus-data:
